<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7a8c2">
  <meta name="description" content="Bolajonlar — O‘zbek tilidagi bolalar uchun oflayn ta’limiy PWA.">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>Bolajonlar — O‘ynab o‘rganamiz!</title>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <button class="back-btn" id="backBtn" aria-label="Orqaga">‹</button>
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><span></span><i></i><b></b><em></em><strong></strong></div>
      <div><h1>Bolajonlar</h1><p>O‘ynab o‘rganamiz!</p></div>
    </div>
    <button class="sound-btn" id="globalSoundBtn" aria-label="Ovoz">♪</button>
  </header>

  <main id="app" class="screen" tabindex="-1"></main>

  <nav class="bottom-nav" aria-label="Asosiy navigatsiya">
    <button data-route="home" class="nav-btn active"><span class="nav-glyph">⌂</span><span>Bosh sahifa</span></button>
    <button data-route="lessons" class="nav-btn"><span class="nav-glyph">▦</span><span>Darslar</span></button>
    <button data-route="quiz" class="nav-btn"><span class="nav-glyph">✦</span><span>Quiz</span></button>
    <button data-route="ranking" class="nav-btn"><span class="nav-glyph">♕</span><span>Reyting</span></button>
  </nav>
</div>

<div id="toast" class="toast" role="status"></div>
<div id="installBar" class="install-bar" hidden>
  <div><b>Bolajonlar ilovasini o‘rnating</b><span>Telefoningizda tezroq ochiladi.</span></div>
  <button id="installBtn" class="mini-primary">O‘rnatish</button>
</div>
<script src="app.js"></script>
</body>
</html>
